name: CI
on:
  push:
    branches: [main]
  pull_request:

# This is a forced fork: CI checks that it builds and passes upstream's tests.
# It deliberately does NOT run `cargo fmt --check` or deny clippy warnings —
# upstream's code is not rustfmt-clean, and reformatting it would create
# divergence that conflicts on every future merge from upstream.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --all-targets
      - uses: taiki-e/install-action@nextest
      - name: tests
        run: cargo nextest run
