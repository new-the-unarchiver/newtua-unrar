[package]
edition = "2021"
name = "newtua-unrar"
version = "0.5.8-newtua.1"
authors = [
    "Danyel Bayraktar <rust@danyel.io>",
    "vjoki <vjoki@zv.fi>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Forced fork of the `unrar` crate (0.5.8) with null-pointer guards in the libunrar callback. Not maintained as a product."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/new-the-unarchiver/newtua-unrar"

[lib]
name = "unrar"
path = "src/lib.rs"

[[example]]
name = "basic_extract"
path = "examples/basic_extract.rs"

[[example]]
name = "basic_list"
path = "examples/basic_list.rs"

[[example]]
name = "lister"
path = "examples/lister.rs"

[[example]]
name = "read_named"
path = "examples/read_named.rs"

[[test]]
name = "archiveflags"
path = "tests/archiveflags.rs"

[[test]]
name = "crypted"
path = "tests/crypted.rs"

[[test]]
name = "multipart"
path = "tests/multipart.rs"

[[test]]
name = "simple"
path = "tests/simple.rs"

[[test]]
name = "utf8"
path = "tests/utf8.rs"

[dependencies.bitflags]
version = "2"

[dependencies.regex]
version = "1"

[dependencies.unrar_sys]
version = "0.5"

[dependencies.widestring]
version = "1"

[dev-dependencies.tempfile]
version = "3.12.0"
